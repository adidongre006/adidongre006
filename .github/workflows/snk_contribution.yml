# ============================================================
# GitHub Contribution Snake
# ============================================================
# Generates a snake animation from the GitHub contribution graph
# and publishes the generated files to the "output" branch.
#
# Schedule:
#   - Runs automatically every 2 hours
#   - Can also be triggered manually from GitHub Actions
#
# Generated files:
#   output/github-contribution-grid-snake.svg
#   output/github-contribution-grid-snake-dark.svg
#   output/github-contribution-grid-snake.gif
#
# Author: Aditya Dongre
# GitHub: https://github.com/adidongre006
# ============================================================

name: 🐍 Generate Contribution Snake


# ============================================================
# WHEN SHOULD THIS WORKFLOW RUN?
# ============================================================

on:

  # Run automatically every 2 hours.
  #
  # Cron format:
  #   minute hour day-of-month month day-of-week
  #
  # "0 */2 * * *" = every 2 hours at minute 0
  schedule:
    - cron: "0 */2 * * *"

  # Allows the workflow to be manually started from:
  # GitHub → Actions → Generate Contribution Snake → Run workflow
  workflow_dispatch:


# ============================================================
# PERMISSIONS
# ============================================================
# The workflow needs permission to:
#   - Read repository contents
#   - Write generated files to the output branch
# ============================================================

permissions:
  contents: write


# ============================================================
# JOBS
# ============================================================

jobs:

  # ----------------------------------------------------------
  # Generate Snake Animation
  # ----------------------------------------------------------

  generate:

    # Use the latest Ubuntu GitHub-hosted runner.
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------
      # Downloads the repository so the workflow can access it.

      - name: 📥 Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. Generate contribution snake
      # ------------------------------------------------------
      # Platane/snk reads the GitHub contribution graph of the
      # specified username and generates the snake animation.
      #
      # Outputs:
      #   - Normal SVG
      #   - Dark-mode SVG
      #   - GIF animation
      #
      # Files are temporarily stored inside the "dist" folder.

      - name: 🐍 Generate contribution snake
        uses: Platane/snk@v3
        with:

          # GitHub username whose contribution graph
          # should be converted into the snake animation.
          github_user_name: adidongre006

          # Files generated by the action.
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg
            dist/github-contribution-grid-snake.gif


      # ------------------------------------------------------
      # 3. Publish generated files
      # ------------------------------------------------------
      # Publishes everything inside "dist" to the "output"
      # branch.
      #
      # This keeps generated files out of the main branch and
      # makes the output branch dedicated to GitHub assets.

      - name: 🚀 Deploy snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:

          # Directory containing the generated files.
          build_dir: dist

          # Dedicated branch for generated snake assets.
          target_branch: output

        env:

          # GitHub automatically provides this token.
          # It allows the action to update the output branch.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
